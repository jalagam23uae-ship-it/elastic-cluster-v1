version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fednow-postgres
    environment:
      POSTGRES_DB: fednow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fednow-network

  iso20022-converter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fednow-converter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: fednow
      DB_USER: postgres
      DB_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    networks:
      - fednow-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local

networks:
  fednow-network:
    driver: bridge
